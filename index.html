<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的小屋</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff6b81',
                        loveDark: '#ff4757'
                    },
                    fontFamily: {
                        love: ['"Pacifico"', 'cursive']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            }
            .heart-beat {
                animation: heartBeat 1.5s infinite;
            }
            @keyframes heartBeat {
                0% { transform: scale(1); }
                14% { transform: scale(1.1); }
                28% { transform: scale(1); }
                42% { transform: scale(1.1); }
                70% { transform: scale(1); }
            }
            .fade-in {
                animation: fadeIn 1s ease-in;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
        /* 修复后的图片编辑样式 */
        .image-scroll-wrapper {
            max-height: calc(70vh - 120px);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        .image-edit-container {
            width: 100%;
            min-height: 200px;
            margin: 0;
            background: #f8f8f8;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        #previewHomeImage {
            max-width: none;
            transform-origin: 0 0;
            cursor: grab;
        }
        #previewHomeImage:active {
            cursor: grabbing;
        }
        .fixed-footer {
            position: sticky;
            bottom: 0;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
            margin: 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-pink-50 to-red-50 min-h-screen">
    <!-- 弹窗：修改首页合照 修复完成 -->
    <div id="changeHomeImageModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b">
                <h3 class="text-xl font-bold text-gray-800">更换首页合照</h3>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 pb-0">
                <input type="file" id="homeImageInput" accept="image/*" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-love file:text-white
                    hover:file:bg-loveDark
                "/>
            </div>
            <div class="image-scroll-wrapper mt-3 px-4">
                <div class="image-edit-container">
                    <img id="previewHomeImage" src="" alt="预览合照">
                </div>
            </div>
            <div class="fixed-footer p-4">
                <div class="flex gap-3 justify-end">
                    <button id="cancelChangeBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">取消</button>
                    <button id="saveHomeImageBtn" disabled class="px-4 py-2 rounded-lg bg-love text-white hover:bg-loveDark disabled:opacity-50 disabled:cursor-not-allowed">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 首页内容 -->
    <header class="relative h-screen flex flex-col items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img id="homeBgImage" src="https://cdn.pixabay.com/photo/2021/02/12/01/28/love-6005564_1280.jpg" alt="background" class="w-full h-full object-cover filter brightness-50">
        </div>
        <div class="z-10 text-center text-white px-4 fade-in">
            <h1 class="text-[clamp(2rem,8vw,4rem)] font-love text-shadow mb-4" id="homeTitle">我们的爱的小屋</h1>
            <p class="text-[clamp(1rem,3vw,1.5rem)] mb-8 text-shadow" id="homeSubtitle">纪念我们在一起的每一天</p>
            <button id="openChangeImageBtn" class="mb-6 px-6 py-2 bg-white/20 backdrop-blur-sm border border-white/40 rounded-full text-white hover:bg-white/30 transition">
                <i class="fa fa-picture-o mr-2"></i>更换封面合照
            </button>
            <br>
            <a href="#memories" class="inline-block animate-bounce">
                <i class="fa fa-angle-down text-3xl"></i>
            </a>
        </div>
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-white z-10">
            <i class="fa fa-heart text-love heart-beat text-2xl"></i>
        </div>
    </header>

    <section id="memories" class="py-16 px-4 max-w-6xl mx-auto">
        <h2 class="text-3xl font-love text-center text-love mb-12">我们的回忆</h2>
        <div id="memoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 回忆卡片会在这里动态生成 -->
        </div>
        <div class="text-center mt-10">
            <button id="addMemoryBtn" class="px-6 py-3 bg-love text-white rounded-full hover:bg-loveDark transition">
                <i class="fa fa-plus mr-2"></i>添加新回忆
            </button>
        </div>
    </section>

    <footer class="py-8 text-center text-gray-600">
        <p>Made with <i class="fa fa-heart text-love"></i> by Love</p>
        <p class="text-sm mt-2">© <span id="year"></span> 我们的爱的小屋</p>
    </footer>

    <script>
        // 基础工具函数
        function saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }
        function getData(key, defaultData) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : defaultData;
        }

        // 初始化全局数据
        let homeData = getData('loveCabin_home', {
            title: '我们的爱的小屋',
            subtitle: '纪念我们在一起的每一天',
            bgImage: 'https://cdn.pixabay.com/photo/2021/02/12/01/28/love-6005564_1280.jpg'
        });
        let memories = getData('loveCabin_memories', []);

        // 更新首页数据
        function updateHome() {
            document.getElementById('homeTitle').textContent = homeData.title;
            document.getElementById('homeSubtitle').textContent = homeData.subtitle;
            document.getElementById('homeBgImage').src = homeData.bgImage;
            saveData('loveCabin_home', homeData);
        }

        // 渲染回忆列表
        function renderMemories() {
            const grid = document.getElementById('memoriesGrid');
            grid.innerHTML = '';
            if (memories.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">还没有添加任何回忆，快来添加第一条回忆吧❤️</p>`;
                return;
            }
            memories.forEach((memory, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition fade-in';
                card.innerHTML = `
                    <img src="${memory.image}" alt="${memory.title}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-semibold text-gray-800 mb-2">${memory.title}</h3>
                        <p class="text-gray-600 mb-3">${memory.date}</p>
                        <p class="text-gray-700">${memory.desc}</p>
                        <div class="mt-4 flex justify-end">
                            <button data-index="${index}" class="delete-memory-btn text-love hover:text-loveDark">
                                <i class="fa fa-trash mr-1"></i>删除
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            // 删除事件绑定
            document.querySelectorAll('.delete-memory-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    if (confirm('确定要删除这个回忆吗？')) {
                        memories.splice(index, 1);
                        saveData('loveCabin_memories', memories);
                        renderMemories();
                    }
                });
            });
        }

        // ============== 修复后的图片编辑逻辑 ==============
        const modal = document.getElementById('changeHomeImageModal');
        const openBtn = document.getElementById('openChangeImageBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelChangeBtn');
        const saveBtn = document.getElementById('saveHomeImageBtn');
        const imageInput = document.getElementById('homeImageInput');
        const previewImg = document.getElementById('previewHomeImage');
        const container = document.querySelector('.image-edit-container');

        let currentScale = 1;
        let posX = 0, posY = 0;

        // 打开关闭弹窗
        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
            previewImg.src = homeData.bgImage;
            previewImg.onload = () => {
                const containerWidth = container.clientWidth;
                currentScale = containerWidth / previewImg.naturalWidth;
                posX = 0; posY = 0;
                updateTransform();
                saveBtn.disabled = false;
            }
        });
        [closeBtn, cancelBtn].forEach(btn => {
            btn.addEventListener('click', () => modal.classList.add('hidden'));
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        });

        // 图片预览&手势逻辑
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                previewImg.src = ev.target.result;
                previewImg.onload = function() {
                    const containerWidth = container.clientWidth;
                    currentScale = containerWidth / previewImg.naturalWidth;
                    posX = 0; posY = 0;
                    updateTransform();
                    saveBtn.disabled = false;
                }
            }
            reader.readAsDataURL(file);
        });

        const hammerManager = new Hammer(container);
        hammerManager.get('pinch').set({ enable: true });
        hammerManager.get('pan').set({ direction: Hammer.DIRECTION_ALL });

        hammerManager.on('pinch', function(e) {
            currentScale *= e.scale;
            currentScale = Math.max(0.5, Math.min(currentScale, 4));
            updateTransform();
            e.scale = 1;
        });

        hammerManager.on('pan', function(e) {
            posX += e.deltaX;
            posY += e.deltaY;
            updateTransform();
        });

        function updateTransform() {
            previewImg.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
        }

        container.addEventListener('dblclick', () => {
            const containerWidth = container.clientWidth;
            currentScale = containerWidth / previewImg.naturalWidth;
            posX = 0; posY = 0;
            updateTransform();
        });

        // 保存修改
        saveBtn.addEventListener('click', () => {
            if (previewImg.src) {
                homeData.bgImage = previewImg.src;
                updateHome();
                modal.classList.add('hidden');
                alert('封面修改成功！');
            }
        });

        // 添加回忆功能省略，原有逻辑保留完整
        document.getElementById('addMemoryBtn').addEventListener('click', () => {
            const title = prompt('请输入回忆标题：');
            if (!title) return;
            const date = prompt('请输入回忆日期（如：2023年5月20日）：');
            if (date === null) return;
            const desc = prompt('请输入回忆描述：');
            if (desc === null) return;
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    memories.unshift({
                        title: title,
                        date: date || '未标注日期',
                        desc: desc || '',
                        image: ev.target.result
                    });
                    saveData('loveCabin_memories', memories);
                    renderMemories();
                    alert('回忆添加成功！');
                }
                reader.readAsDataURL(file);
            }
            fileInput.click();
        });

        // 初始化页面
        document.getElementById('year').textContent = new Date().getFullYear();
        updateHome();
        renderMemories();
    </script>
</body>
</html>

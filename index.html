<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的爱之小屋</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="nav-title">💒 爱之小屋</h1>
      <div class="nav-links">
        <button class="nav-link active" data-target="home">首页</button>
        <button class="nav-link" data-target="memory">记忆长廊</button>
        <button class="nav-link" data-target="wish">愿望清单</button>
      </div>
    </div>
  </nav>

  <!-- 首页：倒计时模块 -->
  <section id="home" class="page active-page">
    <div class="home-card">
      <h2 class="love-title">我们在一起的第 <span id="day-count">...</span> 天</h2>
      <p class="love-subtitle">❤️ 从遇见你开始，漫漫长路都有了意义 ❤️</p>
      <div class="couple-info">
        <div class="person">
          <div class="avatar">👦</div>
          <p>xxx</p> <!-- 改成男方名字 -->
        </div>
        <div class="split">♥</div>
        <div class="person">
          <div class="avatar">👧</div>
          <p>xxx</p> <!-- 改成女方名字 -->
        </div>
      </div>
      <img id="home-cover" class="cover" alt="我们的合照" />
    </div>
  </section>

  <!-- 记忆长廊：照片+日记打卡 -->
  <section id="memory" class="page">
    <div class="memory-header">
      <h2>📜 我们的记忆长廊</h2>
      <button id="add-memory-btn" class="add-btn">+ 新增打卡</button>
    </div>
    <!-- 新增打卡弹窗 -->
    <div id="memory-modal" class="modal">
      <div class="modal-content">
        <h3>写下今天的记忆</h3>
        <textarea id="memory-text" placeholder="想说的话、今天的小故事..." rows="4"></textarea>
        <div class="upload-area">
          <label for="memory-img">添加照片：</label>
          <input type="file" id="memory-img" accept="image/*">
          <div id="img-preview"></div>
        </div>
        <div class="modal-btns">
          <button id="cancel-memory" class="btn secondary">取消</button>
          <button id="save-memory" class="btn primary">保存记忆</button>
        </div>
      </div>
    </div>
    <!-- 记忆列表长廊 -->
    <div id="memory-list" class="memory-list">
      <p class="empty-tip">还没有打卡记忆，快来写下我们的第一条吧～</p>
    </div>
  </section>

  <!-- 愿望清单 -->
  <section id="wish" class="page">
    <div class="wish-header">
      <h2>📝 我们的愿望清单</h2>
      <button id="add-wish-btn" class="add-btn">+ 新增愿望</button>
    </div>
    <div id="wish-modal" class="modal">
      <div class="modal-content">
        <h3>添加新愿望</h3>
        <input type="text" id="wish-text" placeholder="写下你想和TA一起完成的愿望">
        <div class="modal-btns">
          <button id="cancel-wish" class="btn secondary">取消</button>
          <button id="save-wish" class="btn primary">保存</button>
        </div>
      </div>
    </div>
    <div id="wish-list" class="wish-list">
      <p class="empty-tip">还没有添加愿望，快来写下我们的第一个小目标吧～</p>
    </div>
  </section>

  <footer class="footer">
    <p>Made with ❤️ by us</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
